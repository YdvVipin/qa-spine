name: qa-spine gate
description: >-
  Check a change against the qa-spine trace ledger: report unanswered questions on the
  requirements it touches, and optionally record the release verdict.

inputs:
  db:
    description: >-
      Path to the trace store, relative to the workspace. The store is the consuming
      project's to provide — commit it, restore it from a cache, or fetch it before this
      step. A missing or empty store fails the job rather than reporting a clean release.
    required: true
  since:
    description: >-
      Git ref to compare against, usually the pull request's base. Changed paths and
      ticket keys are derived from the range. Requires fetch-depth 0 on checkout.
    required: false
    default: ''
  changed:
    description: >-
      Extra refs to assess, comma-separated, each taken exactly as written. For a pull
      request title or body use `text`, which picks the ticket keys out of it.
    required: false
    default: ''
  text:
    description: >-
      Free text such as the pull request title: the ticket keys in it (matched by
      ticket-pattern) are assessed, the rest is ignored. Read as data, never run.
    required: false
    default: ''
  junit:
    description: >-
      JUnit XML report paths to record before the gate runs, space-separated; shell globs
      allowed (e.g. 'reports/**/*.xml'). A failing test on a changed area then blocks. A
      pattern matching no file fails the job rather than skipping the ingest. Run this step
      with `if: always()` after your test step, or a failing test job never reaches the gate.
    required: false
    default: ''
  block-on-suspect:
    description: >-
      Fail while a requirement this change touches was edited after its last audit. Off by
      default: it is reported either way. Only a re-audit clears it, not an override.
    required: false
    default: 'false'
  require-coverage:
    description: >-
      No longer has any effect: since 0.4 a requirement with no test is always UNKNOWN and
      fails the job. Accepted so existing workflows keep running.
    required: false
    default: 'false'
  commit:
    description: >-
      Decide on this build only: test results recorded for any other commit do not count,
      and a required test with no result on this commit is UNKNOWN. Left empty with `junit`
      set, it is the checked-out commit, which is also recorded on the ingested reports.
      Left empty without `junit`, or set to `any`, results from every commit count.
    required: false
    default: ''
  environment:
    description: 'Only test results recorded for this environment count. Also recorded on ingested reports.'
    required: false
    default: ''
  advisory:
    description: >-
      Report the decision without failing the job. The summary and the `decision` output
      still say HOLD or UNKNOWN; only the exit status changes.
    required: false
    default: 'false'
  ticket-pattern:
    description: 'Regular expression matching ticket keys. Defaults to the Jira shape.'
    required: false
    default: ''
  release-ref:
    description: 'Release identifier recorded on the verdict. Required when record is true.'
    required: false
    default: ''
  record:
    description: >-
      Record a verdict. Leave false on pull requests; set it on a release event. The
      ledger is append-only, so a verdict per push can never be removed.
    required: false
    default: 'false'
  reason:
    description: 'Verdict reason. Left empty, the gate writes a factual one.'
    required: false
    default: ''
  override-reason:
    description: 'Why this ships despite an unanswered question. Requires approved-by.'
    required: false
    default: ''
  approved-by:
    description: 'Who accepted the risk. Required with override-reason.'
    required: false
    default: ''
  comment:
    description: 'Post the summary as a pull request comment. Needs github-token.'
    required: false
    default: 'false'
  github-token:
    description: 'Token used only by gh to post the comment. Never seen by qa-spine.'
    required: false
    default: ''
  version:
    description: >-
      Version of qa-spine to run: a release such as 0.4.0, or a dist-tag such as latest.
      Defaults to the release this Action was tested with, so a new release never changes a
      workflow until it moves to a newer tag of the Action.
    required: false
    default: '0.4.0'

outputs:
  decision:
    description: 'SHIP, HOLD (a known blocker), UNKNOWN (evidence missing) or OVERRIDDEN.'
    value: ${{ steps.run.outputs.decision }}
  shippable:
    description: '"true" on SHIP or OVERRIDDEN. Kept for 0.3 workflows; prefer decision.'
    value: ${{ steps.run.outputs.shippable }}
  verdict-id:
    description: 'The recorded verdict id, empty unless record was true.'
    value: ${{ steps.run.outputs.verdict-id }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '22'

    - id: run
      shell: bash
      # Every value reaches the script through the environment, never spliced into its source:
      # a PR title holding $(...) or a quote is data. tests/ci-input.test.ts holds this.
      env:
        QA_SPINE_DB: ${{ inputs.db }}
        QS_VERSION: ${{ inputs.version }}
        QS_SINCE: ${{ inputs.since }}
        QS_CHANGED: ${{ inputs.changed }}
        QS_TEXT: ${{ inputs.text }}
        QS_JUNIT: ${{ inputs.junit }}
        QS_TICKET_PATTERN: ${{ inputs.ticket-pattern }}
        QS_RELEASE_REF: ${{ inputs.release-ref }}
        QS_RECORD: ${{ inputs.record }}
        QS_BLOCK_ON_SUSPECT: ${{ inputs.block-on-suspect }}
        QS_COMMIT: ${{ inputs.commit }}
        QS_ENVIRONMENT: ${{ inputs.environment }}
        QS_ADVISORY: ${{ inputs.advisory }}
        QS_REASON: ${{ inputs.reason }}
        QS_OVERRIDE_REASON: ${{ inputs.override-reason }}
        QS_APPROVED_BY: ${{ inputs.approved-by }}
      run: |
        set -o pipefail

        # A version or dist-tag only: anything else is a package spec, and npm:, file: or a URL
        # after the @ would run some other package under this one's name.
        if ! [[ "$QS_VERSION" =~ ^([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?|[a-z][a-z0-9-]*)$ ]]; then
          echo "::error::qa-spine: version must be a release such as 0.4.0 or a dist-tag such as latest"
          exit 2
        fi
        qs() { npx --yes "qa-spine@$QS_VERSION" "$@"; }

        # A ledger nobody can vouch for cannot clear or block a release: that is "could not
        # tell". Checked before anything reads it or writes to it.
        set +e
        qs verify > verify.json 2> verify.err
        verify_status=$?
        set -e
        if [ "$verify_status" != "0" ]; then
          echo "::error::qa-spine: the trace store failed its integrity check"
          cat verify.json verify.err >&2
          exit 2
        fi

        # Which build decides. With reports ingested here, this checkout: a pass recorded for
        # another build says nothing about this one. `any` counts results from every build.
        if [ "$QS_COMMIT" = "any" ]; then
          QS_COMMIT=""
        elif [ -z "$QS_COMMIT" ] && [ -n "$QS_JUNIT" ]; then
          QS_COMMIT="$(git rev-parse HEAD 2>/dev/null || true)"
        fi

        # Test results first, into the same store, so the gate below sees them. A glob that
        # matches nothing is an error: "no reports" read as "no failures" is a false green.
        if [ -n "$QS_JUNIT" ]; then
          # Unquoted on purpose: split on spaces and expand the globs. Expansion never runs
          # anything, so a pattern is still only a pattern.
          shopt -s nullglob globstar
          reports=( $QS_JUNIT )
          shopt -u nullglob globstar
          if [ "${#reports[@]}" -eq 0 ]; then
            echo "::error::qa-spine: junit pattern '$QS_JUNIT' matched no file"
            exit 2
          fi
          # The attempt is part of the ref: a re-run is a new result, while a retried upload
          # of the same attempt is recognised as one and not counted twice.
          ingest_args=(--run-ref "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/${GITHUB_RUN_ATTEMPT:-1}")
          [ -n "$QS_ENVIRONMENT" ] && ingest_args+=(--environment "$QS_ENVIRONMENT")
          [ -n "$QS_COMMIT" ] && ingest_args+=(--commit "$QS_COMMIT")
          set +e
          qs ingest-junit "${reports[@]}" "${ingest_args[@]}" > ingest.json 2> ingest.err
          ingest_status=$?
          set -e
          if [ "$ingest_status" != "0" ]; then
            echo "::error::qa-spine could not record the test reports"
            cat ingest.err >&2
            exit 2
          fi
        fi

        # One run produces both outputs: JSON on stdout, Markdown to gate.md. Running the
        # gate twice would append a second verdict under --record, and an append-only
        # ledger cannot remove either.
        args=(gate --json --summary gate.md)
        [ -n "$QS_SINCE" ]                     && args+=(--since "$QS_SINCE")
        [ -n "$QS_CHANGED" ]                   && args+=(--changed "$QS_CHANGED")
        [ -n "$QS_TEXT" ]                      && args+=(--text "$QS_TEXT")
        [ -n "$QS_TICKET_PATTERN" ]            && args+=(--ticket-pattern "$QS_TICKET_PATTERN")
        [ -n "$QS_RELEASE_REF" ]               && args+=(--release-ref "$QS_RELEASE_REF")
        [ "$QS_RECORD" = "true" ]              && args+=(--record)
        [ "$QS_BLOCK_ON_SUSPECT" = "true" ]    && args+=(--block-on-suspect)
        [ -n "$QS_COMMIT" ]                    && args+=(--commit "$QS_COMMIT")
        [ -n "$QS_ENVIRONMENT" ]               && args+=(--environment "$QS_ENVIRONMENT")
        [ "$QS_ADVISORY" = "true" ]            && args+=(--advisory)
        [ -n "$QS_REASON" ]                    && args+=(--reason "$QS_REASON")
        [ -n "$QS_OVERRIDE_REASON" ]           && args+=(--override-reason "$QS_OVERRIDE_REASON")
        [ -n "$QS_APPROVED_BY" ]               && args+=(--approved-by "$QS_APPROVED_BY")

        # Exit code is the product: 0 SHIP/OVERRIDDEN, 1 HOLD, 2 UNKNOWN or could not run. Capture it
        # rather than letting `set -e` end the step, so the summary still gets posted —
        # then re-raise it at the bottom so a blocked gate really does fail the job.
        set +e
        qs "${args[@]}" > gate.json 2> gate.err
        status=$?
        set -e

        # 2 is either UNKNOWN, which has a decision and a summary worth posting, or a gate
        # that could not run at all, which has neither.
        if [ "$status" = "2" ] && ! node -e 'process.exit(JSON.parse(require("fs").readFileSync("gate.json", "utf8")).decision ? 0 : 1)' 2>/dev/null; then
          echo "::error::qa-spine gate could not assess this change"
          cat gate.err >&2
          exit 2
        fi

        node -e '
          const r = JSON.parse(require("fs").readFileSync("gate.json", "utf8"));
          const out = process.env.GITHUB_OUTPUT;
          require("fs").appendFileSync(out, `decision=${r.decision}\n`);
          require("fs").appendFileSync(out, `shippable=${r.shippable}\n`);
          require("fs").appendFileSync(out, `verdict-id=${r.recorded ? r.recorded.verdictId : ""}\n`);
        '
        echo "exit=$status" >> "$GITHUB_OUTPUT"

        cat gate.md >> "$GITHUB_STEP_SUMMARY"
        exit 0

    - if: inputs.comment == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: gh pr comment "$PR_NUMBER" --body-file gate.md

    - shell: bash
      env:
        QS_EXIT: ${{ steps.run.outputs.exit }}
      run: |
        case "${QS_EXIT:-0}" in
          0) ;;
          1) echo "::error::qa-spine gate: HOLD — a known blocker on the areas this change touches (see the summary)"; exit 1 ;;
          *) echo "::error::qa-spine gate: UNKNOWN — evidence is missing for the areas this change touches (see the summary)"; exit 2 ;;
        esac
