# qa-spine's own CI. Tests run from source; the smoke jobs install the one tarball packed
# here, so what passes is the artifact that gets published, not the working tree.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.18 is the oldest Node that runs .ts without a flag; the package itself needs 22.13.
        node: ['22.18.0', '24', '26']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  pack:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: mkdir pkg && npm pack --pack-destination pkg
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: pkg/*.tgz

  smoke:
    needs: pack
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22.13.0', '22', '24', '26']
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: pkg
      - shell: bash
        run: node scripts/smoke-package.mjs pkg/*.tgz

  # The bin on a Node too old to run qa-spine: one sentence and exit 2, not the stack trace that
  # importing node:sqlite gives. 22.12 is the last Node where node:sqlite needs a flag. Only
  # cli.js runs here, so no install is needed.
  old-node:
    needs: pack
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22.12.0']
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: pkg
      - shell: bash
        run: |
          tar -xzf pkg/*.tgz
          set +e
          node package/dist/cli.js --version 2> err.txt
          code=$?
          set -e
          cat err.txt
          [ "$code" = "2" ] || { echo "expected exit 2, got $code"; exit 1; }
          grep -qF "qa-spine needs Node 22.13 or later; this is Node $(node -p process.versions.node)." err.txt
          [ "$(wc -l < err.txt)" = "1" ] || { echo "expected one line"; exit 1; }
